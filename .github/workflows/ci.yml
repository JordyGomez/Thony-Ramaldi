name: Calidad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:database
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Vacías: las pruebas usan los datos locales, no el panel en vivo.
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          THONY_TEST_FIXTURES: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "true"
      # Otra compilación sin fixtures demuestra que un entorno sin Supabase
      # conserva el catálogo vacío y nunca publica los ejemplos de las pruebas.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          THONY_TEST_FIXTURES: ""
      - run: npx playwright test --config=playwright.public.config.ts
        env:
          CI: "true"
      # Auth, permisos, Storage y CMS contra un doble HTTP solo en loopback.
      # La migración SQL se comprueba además con PostgreSQL embebido arriba.
      - run: npm run test:admin
        env:
          CI: "true"
      # La ampliación empresarial usa Auth/Storage locales y PostgreSQL/RLS real
      # embebido, sin usuarios ni propiedades en Supabase de producción.
      - run: npm run test:platform
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-admin/
            test-results/
